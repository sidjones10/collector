<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Comic Detail - Collector</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="detail-page">
    <nav class="sidebar">
        <div class="sidebar-icon" data-page="home" onclick="window.location.href='index.html'" title="Home">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
            </svg>
        </div>
        <div class="sidebar-icon active" data-page="library" onclick="window.location.href='deck.html'" title="Library">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M18 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zM6 4h5v8l-2.5-1.5L6 12V4z"/>
            </svg>
        </div>
        <div class="sidebar-icon" data-page="search" onclick="window.location.href='deck.html'" title="Search">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
            </svg>
        </div>
        <div class="sidebar-icon" data-page="download" title="Import Comics">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2z"/>
            </svg>
        </div>
        <div class="sidebar-icon" data-page="readlist" title="Read List">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
            </svg>
        </div>
        <div class="sidebar-icon" data-page="settings" title="Settings">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="currentColor">
                <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58c.18-.14.23-.41.12-.61l-1.92-3.32c-.12-.22-.37-.29-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94L14.4 2.81c-.04-.24-.24-.41-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58c-.18.14-.23.41-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/>
            </svg>
        </div>
    </nav>

    <main class="main-content detail-content">
        <header class="deck-header">
            <h1 class="page-title" id="comic-series"></h1>
            <button class="back-btn" onclick="window.location.href='deck.html'">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                Back
            </button>
        </header>

        <div class="detail-container">
            <div class="detail-left">
                <img id="comic-cover" src="" alt="Comic Cover" class="detail-cover">
            </div>

            <div class="detail-right">
                <h2 id="comic-volume" class="comic-volume"></h2>
                <p id="comic-year" class="comic-year"></p>

                <div class="rating-section">
                    <div class="rating-block">
                        <p class="rating-label">Your Rating:</p>
                        <div id="user-rating" class="star-rating user-rating">
                            <span class="star" data-rating="1">★</span>
                            <span class="star" data-rating="2">★</span>
                            <span class="star" data-rating="3">★</span>
                            <span class="star" data-rating="4">★</span>
                            <span class="star" data-rating="5">★</span>
                        </div>
                    </div>

                    <div class="rating-block">
                        <p class="rating-label">Readers Rating:</p>
                        <div id="readers-rating" class="star-rating readers-rating">
                            <span class="star filled">★</span>
                            <span class="star filled">★</span>
                            <span class="star filled">★</span>
                            <span class="star filled">★</span>
                            <span class="star filled">★</span>
                        </div>
                    </div>
                </div>

                <div class="description-section">
                    <p id="comic-description" class="comic-description"></p>
                </div>

                <div class="action-buttons">
                    <button class="action-btn" onclick="toggleReadList()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/>
                        </svg>
                        Add to Read List
                    </button>
                    <button class="action-btn" onclick="removeFromCollection()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
                        </svg>
                        Remove from Collection
                    </button>
                </div>
            </div>
        </div>

        <footer class="deck-footer">
            <p class="brand-footer">STICKYPAGES</p>
        </footer>
    </main>

    <script src="js/data.js"></script>
    <script src="js/detail.js"></script>
</body>
</html>
