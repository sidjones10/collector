<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collector - Your Comic Library</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="landing-page">
    <div class="hero-section">
        <div class="hero-overlay"></div>
        <header class="hero-header">
            <h1 class="brand-title">STICKYPAGES</h1>
        </header>

        <div class="hero-content">
            <div class="hero-text">
                <h2 class="hero-title">Comics</h2>
                <p class="hero-subtitle">comics of the week</p>

                <div class="comics-showcase">
                    <div class="comic-row">
                        <div class="showcase-comic" data-comic="xmen">
                            <img src="https://via.placeholder.com/150x230/DC143C/FFFFFF?text=X-Men" alt="X-Men">
                        </div>
                        <div class="showcase-comic" data-comic="batman">
                            <img src="https://via.placeholder.com/150x230/0047AB/FFFFFF?text=Batman" alt="Batman">
                        </div>
                        <div class="showcase-comic" data-comic="wolverine">
                            <img src="https://via.placeholder.com/150x230/DC143C/FFFFFF?text=Wolverine" alt="Wolverine">
                        </div>
                        <div class="showcase-comic" data-comic="walking-dead">
                            <img src="https://via.placeholder.com/150x230/0047AB/FFFFFF?text=Walking+Dead" alt="The Walking Dead">
                        </div>
                    </div>
                </div>

                <h3 class="section-title">new releases</h3>
                <div class="comics-showcase">
                    <div class="comic-row">
                        <div class="showcase-comic">
                            <img src="https://via.placeholder.com/150x230/DC143C/FFFFFF?text=X-Men+New" alt="X-Men New">
                        </div>
                        <div class="showcase-comic">
                            <img src="https://via.placeholder.com/150x230/0047AB/FFFFFF?text=Wolverine+New" alt="Wolverine New">
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="launch-banner">
            <span class="launch-text">LAUNCHING</span>
            <span class="launch-date">JUNE 6</span>
        </div>

        <button class="enter-vault-btn" onclick="window.location.href='deck.html'">
            Enter the Vault
        </button>
    </div>
</body>
</html>
